<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Footnotes</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Global Footnotes">
<meta property="og:description" content="세계 20대의 불안과 꿈, 그리고 각자 고른 한 문장. (현재는 예시 인물)">
<meta name="theme-color" content="#eceee8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600&family=Caveat:wght@500&family=Nanum+Pen+Script&display=swap">
<style>
/* 레이아웃: 한 화면 앱. 지구가 무대, 카탈로그(나라·불안·꿈)는 폰에선 아래 서랍·컴터에선 왼쪽 단. 사람을 열면 폰은 아래에서, 컴터는 오른쪽에서 그 사람의 면이 올라온다. 페이지는 스크롤하지 않는다. */
:root {
  --paper: #eceee8;      /* 차가운 회녹 종이 */
  --ink: #1c2433;        /* 남먹 */
  --ink-soft: #4f5868;
  --rule: #b7bdbf;
  --mag: #ad2366;        /* 인쇄 마젠타: 사람이 있는 자리와 여정 선에만 */
  --serif: 'Hahmlet', 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;
  --hand-ko: 'Nanum Pen Script', 'Caveat', cursive;
  --leafW: min(560px, 42vw);
  --ease: cubic-bezier(.22, .61, .36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #121722; --ink: #e3e6e0; --ink-soft: #a5acb7; --rule: #3a4253; --mag: #ea72aa; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #121722; --ink: #e3e6e0; --ink-soft: #a5acb7; --rule: #3a4253; --mag: #ea72aa; color-scheme: dark; }

html, body { height: 100%; background: var(--paper); }
body { margin: 0; overflow: hidden; color: var(--ink); font-family: var(--serif); font-size: 16px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--mag); outline-offset: 3px; }

.app {
  position: relative; height: 100%; display: grid;
  grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "head" "stage" "cat";
}

/* 머리 — 제호(괘선이 먼저 그어지고 제호가 앉는다: originkit Masthead Reveal 구조를 slow 로) */
.head { grid-area: head; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); transition: opacity 900ms var(--ease); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.brand h1 { margin: 0; min-width: 0; overflow-wrap: normal; font-weight: 600; font-size: 30px; line-height: 1.1; letter-spacing: -.02em; animation: settle 1200ms var(--ease) .4s both; }
.lang { display: flex; gap: 12px; font-size: 14.5px; color: var(--ink-soft); flex: none; }
.lang button { padding-block: 6px; }
.lang button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
.head .rule { height: 1px; background: var(--ink); margin-top: 8px; transform-origin: left; animation: draw 1600ms var(--ease) both; }
.lede { margin: 10px 0 0; font-size: 15px; line-height: 1.6; text-wrap: pretty; animation: settle 1200ms var(--ease) .9s both; }
.lede .demo { display: block; margin-top: 4px; color: var(--ink-soft); font-size: 14px; }
@keyframes draw { from { transform: scaleX(0); } }
@keyframes settle { from { opacity: 0; } }

/* 무대 */
.stage { grid-area: stage; position: relative; display: grid; place-items: center; min-height: 0; overflow: hidden; transition: padding 900ms var(--ease); }
#globe { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; cursor: grab; touch-action: none; }
#globe.drag { cursor: grabbing; }
.hint { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 6px; margin: 0; font-size: 14px; color: var(--ink-soft); transition: opacity 1200ms var(--ease); pointer-events: none; }
.hint.gone { opacity: 0; }

/* 카탈로그 */
.cat { grid-area: cat; background: var(--paper); border-top: 1px solid var(--rule); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.tabs { display: flex; align-items: center; gap: 20px; min-height: 52px; white-space: nowrap; }
.tabs [role="tab"] { flex: none; padding-block: 10px; font-size: 16px; color: var(--ink-soft); }
.tabs [role="tab"][aria-selected="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--mag); text-underline-offset: 6px; text-decoration-thickness: 1px; }
.tabs .count { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: right; font-size: 14px; color: var(--ink-soft); }
#catToggle { flex: none; font-size: 14.5px; padding-block: 10px; text-decoration: underline; text-underline-offset: 4px; }
.catbody { display: none; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 20px; }
.cat.open .catbody { display: block; }
.filter { margin: 2px 0 10px; font-size: 14.5px; color: var(--ink-soft); }
.filter button { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
#catList { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); }
#catList li { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; column-gap: 14px; padding-block: 9px; border-bottom: 1px solid var(--rule); transition: opacity 900ms var(--ease); }
#catList li:last-child { border-bottom: 0; }
#catList li.off { opacity: .3; }
.term { text-align: left; font-weight: 600; align-self: start; white-space: nowrap; }
.term .n { font-weight: 400; color: var(--ink-soft); font-size: 14px; margin-left: 4px; }
.term[aria-pressed="true"] { text-decoration: underline; text-decoration-color: var(--mag); text-underline-offset: 5px; }
.people { display: flex; flex-wrap: wrap; gap: 2px 14px; }
.people a { text-decoration: none; padding-block: 2px; white-space: nowrap; }
.people a:hover, .people a:focus-visible { text-decoration: underline; text-decoration-color: var(--mag); text-underline-offset: 4px; }
.people .where { color: var(--ink-soft); font-size: 14px; }

.colophon { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--rule); }
.colophon h2 { margin: 0; font-size: 18px; font-weight: 600; }
.colophon p { margin: 4px 0 10px; font-size: 14.5px; color: var(--ink-soft); }
#letter { display: grid; gap: 10px; }
#letter .row { display: flex; gap: 16px; align-items: end; flex-wrap: wrap; }
#email { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--ink); padding: 8px 0; border-radius: 0; }
#email::placeholder { color: var(--ink-soft); opacity: .7; }
#send { padding: 8px 0; text-decoration: underline; text-underline-offset: 5px; text-decoration-color: var(--mag); font-weight: 600; }
#letter label { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-soft); line-height: 1.5; }
#consent { margin-top: 3px; accent-color: var(--mag); width: 16px; height: 16px; flex: none; }
#msg { min-height: 1.4em; font-size: 14.5px; }
#msg.err { color: var(--mag); }
.fine { font-size: 14px; color: var(--ink-soft); margin: 14px 0 0; }

/* 폰: 서랍을 펼치면 무대 위로 올라온다 */
@media (max-width: 899px) {
  .cat { position: relative; }
  .cat.open .catbody { position: absolute; left: 0; right: 0; bottom: 100%; max-height: 60vh; max-height: 60dvh; background: var(--paper); border-top: 1px solid var(--rule); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -18px 30px -24px rgba(0, 0, 0, .35); }
}

/* 사람의 면 */
#leaf { position: fixed; z-index: 20; background: var(--paper); overflow-y: auto; overscroll-behavior: contain; opacity: 0; transition: opacity 900ms var(--ease); padding-bottom: env(safe-area-inset-bottom, 0px); }
#leaf.on { opacity: 1; }
.lbar { position: sticky; top: 0; z-index: 1; background: var(--paper); display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; justify-content: space-between; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--rule); font-size: 15px; }
.lbar button { padding-block: 6px; min-height: 32px; white-space: nowrap; }
.lbar button:hover { text-decoration: underline; text-underline-offset: 4px; }
.lnav { display: flex; gap: 18px; }
#lfCtx { color: var(--ink-soft); font-size: 14px; }
.lbody { padding: 22px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); transition: opacity 500ms var(--ease); }
.lbody.swap { opacity: 0; }
.lhead { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 14px; align-items: start; }
#lfName { margin: 0; font-size: 32px; line-height: 1.1; font-weight: 600; letter-spacing: -.02em; }
#lfMeta { margin: 6px 0 0; font-size: 14.5px; color: var(--ink-soft); }
.portrait { margin: 0; }
#lfPic { display: block; width: 84px; height: 84px; }
.portrait figcaption { text-align: center; white-space: nowrap; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
#lfOrig { margin: 24px 0 0; font-size: clamp(36px, 9vw, 54px); line-height: 1.18; text-wrap: balance; }
#lfTr { margin: 8px 0 0; font-style: italic; color: var(--ink-soft); }
#lfWhy { margin: 18px 0 0; padding-left: 14px; border-left: 1px solid var(--mag); }
.qa { list-style: none; margin: 32px 0 0; padding: 0; display: grid; gap: 20px; }
.qa .q { display: block; font-style: italic; color: var(--ink-soft); font-size: 15px; }
.qa .a { display: block; margin-top: 3px; }
#lfTags { margin: 30px 0 0; font-size: 15px; }
#lfTags button { text-decoration: underline; text-decoration-color: var(--mag); text-underline-offset: 4px; }
#lfNote { margin: 12px 0 0; font-size: 14px; color: var(--ink-soft); }

@media (max-width: 899px) {
  #leaf { left: 0; right: 0; bottom: 0; top: 38%; border-top: 1px solid var(--rule); }
  .app.reading .head, .app.reading .cat { opacity: 0; pointer-events: none; }
  .app.reading .stage { grid-area: auto; position: absolute; inset: 0 0 62% 0; padding-top: env(safe-area-inset-top, 0px); }
}

/* 컴터: 왼쪽 단(머리+카탈로그) / 오른쪽 무대 */
@media (min-width: 900px) {
  .app { grid-template-columns: 400px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "head stage" "cat stage"; }
  .head { padding: 32px 28px 0 max(28px, env(safe-area-inset-left, 0px)); }
  .brand h1 { font-size: 40px; }
  .lede { font-size: 16px; }
  .cat { border-top: 0; display: flex; flex-direction: column; min-height: 0; padding: 12px 28px 0 max(28px, env(safe-area-inset-left, 0px)); }
  .cat .catbody { display: block; flex: 1 1 auto; min-height: 0; }
  #catToggle { display: none; }
  .tabs { border-bottom: 1px solid var(--rule); }
  #leaf { top: 0; bottom: 0; right: 0; width: var(--leafW); border-left: 1px solid var(--rule); }
  .app.reading .stage { padding-right: var(--leafW); }
  .lbar, .lbody { padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); }
  .lhead { grid-template-columns: minmax(0, 1fr) 104px; }
  #lfPic { width: 104px; height: 104px; }
  #lfName { font-size: 38px; }
  .hint { left: 28px; bottom: 20px; }
}
@media (max-height: 640px) and (max-width: 899px) { .lede .demo { display: none; } }
@media (max-width: 599px) { html[lang="en"] .tabs .count:not(.on) { display: none; } }
@media (max-width: 359px) { .tabs { gap: 14px; } .tabs [role="tab"] { font-size: 15px; } .brand h1 { font-size: 26px; } }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--paper); padding: 8px 14px; font-size: 15px; opacity: 0; transition: opacity 600ms var(--ease); pointer-events: none; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; }

/* 종이 결 — film-grain-overlay 레시피 */
.grain { position: fixed; inset: 0; pointer-events: none; z-index: 40; background-image: var(--grain, none); opacity: .07; mix-blend-mode: multiply; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .grain { mix-blend-mode: screen; opacity: .05; } }
:root[data-theme="dark"] .grain { mix-blend-mode: screen; opacity: .05; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="grain" aria-hidden="true"></div>

/* ---------- 색 토큰 ---------- */

/* ---------- 점묘 지구 — 레시피 stipple-land-globe (originkit Globe Study 구조) ---------- */

const proj = d3.geoOrthographic().clipAngle(90).precision(.4);
const path = d3.geoPath(proj, g);
const grat = d3.geoGraticule().step([30, 30])();

// 도시 = 점, 나라 = 이름표(사람들 위치의 평균)
const CITIES = (() => { const m = new Map(); PEOPLE.forEach(d => { if (!m.has(d.city)) m.set(d.city, { lon: d.lon, lat: d.lat, country: d.country, ps: [] }); m.get(d.city).ps.push(d); }); return [...m.values()]; })();
const COUNTRIES = groupsOf('country').map(([k, ps]) => ({ key: k, ps, ...mean(ps) }));

let rot = [-20, -18], zoom = 1, side = 300, dpr = 1, R = 140, cx = 150, cy = 150;
let tween = null, held = false, over = false, dragging = null, t0 = performance.now(), last = t0;

new ResizeObserver(([e]) => {
  const r = e.contentRect; side = Math.max(120, Math.floor(Math.min(r.width * (wide.matches || cur ? 1 : 1.1), r.height) - 8));   // 폰에선 양옆을 조금 잘라 지구를 키운다
  dpr = Math.min(2, devicePixelRatio || 1);
  cv.style.width = cv.style.height = side + 'px'; cv.width = cv.height = Math.round(side * dpr);
}).observe(stage);

function p3(lonR, cosLat, sinLat, cl, sl, cp, sp) {

}

  const [a, b, dep] = p3(lon * RAD, Math.cos(lat * RAD), Math.sin(lat * RAD), cl, sl, cp, sp);

  const prog = reduce ? coords.length - 1 : Math.max(0, Math.min(1, (t - 1.2) / 3.2)) * (coords.length - 1);

    g.font = `400 ${fs * .78}px Hahmlet, 'Noto Serif KR', serif`; const w2 = g.measureText(n).width;
    const x = s.x + 7 * dpr, y = s.y - 7 * dpr, box = { x, y: y - fs, w: w1 + w2 + 3 * dpr, h: fs + 3 * dpr };

    boxes.push(box);

    g.lineWidth = 4 * dpr; g.strokeStyle = C.paper; g.fillStyle = C.ink;
    g.font = `600 ${fs}px Hahmlet, 'Noto Serif KR', serif`; g.strokeText(name, x, y); g.fillText(name, x, y);
    g.font = `400 ${fs * .78}px Hahmlet, 'Noto Serif KR', serif`; g.fillStyle = C['ink-soft']; g.strokeText(n, x + w1 + 3 * dpr, y - fs * .32); g.fillText(n, x + w1 + 3 * dpr, y - fs * .32);

function focusGlobe(p, hold) {

}

}
function hideHint() { $('hint').classList.add('gone'); }
cv.addEventListener('pointerdown', e => { dragging = { x: e.clientX, y: e.clientY, r: rot.slice(), moved: false, id: e.pointerId }; tween = null; });
cv.addEventListener('pointermove', e => {
  if (!dragging) { cv.style.cursor = hitAt(e) ? 'pointer' : ''; return; }
  const dx = e.clientX - dragging.x, dy = e.clientY - dragging.y;
  if (!dragging.moved && Math.hypot(dx, dy) > 5) { dragging.moved = true; cv.setPointerCapture(dragging.id); cv.classList.add('drag'); hideHint(); }
  if (dragging.moved) { const k = 180 / (cv.getBoundingClientRect().width / 2 * .92 * zoom) / Math.PI; rot = [dragging.r[0] + dx * k, Math.max(-70, Math.min(70, dragging.r[1] - dy * k))]; }
});
cv.addEventListener('pointerup', e => {
  if (!dragging) return;
  if (!dragging.moved) { const d = hitAt(e); if (d) openPerson(d, listFor(d)); }
  dragging = null; cv.classList.remove('drag');
});
cv.addEventListener('pointercancel', () => { dragging = null; cv.classList.remove('drag'); });
cv.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') over = true; });
cv.addEventListener('pointerleave', () => { over = false; });
// 휠: 핀치(ctrl+휠)는 확대, 두 손가락 쓸기는 회전 — 한 화면 앱이라 페이지 스크롤과 다투지 않는다
cv.addEventListener('wheel', e => {
  e.preventDefault(); tween = null;
  if (e.ctrlKey) { zoom = Math.max(1, Math.min(2.4, zoom * Math.exp(-e.deltaY * .01))); return; }
  const k = 180 / (cv.getBoundingClientRect().width / 2 * .92 * zoom) / Math.PI * .6;
  rot = [rot[0] - e.deltaX * k, Math.max(-70, Math.min(70, rot[1] + e.deltaY * k))]; hideHint();
}, { passive: false });

/* ---------- 점묘 초상 — 셀카 그림 자리 ---------- */
function drawPortrait(d) {
  const c = $('lfPic'), x = c.getContext('2d'), W = c.width;
  const oc = document.createElement('canvas'); oc.width = oc.height = W; const o = oc.getContext('2d');
  const L = d.look || {}, hw = L.style === 'long' ? .3 : L.style === 'curly' ? .33 : .26;
  o.fillStyle = '#f00'; o.beginPath(); o.ellipse(W * .5, W * .4, W * hw, W * (hw + .04), 0, 0, 7); o.fill();
  if (L.style === 'long') o.fillRect(W * .22, W * .4, W * .56, W * .32);
  o.fillStyle = '#00f'; o.beginPath(); o.ellipse(W * .5, W * 1.04, W * .44, W * .3, 0, 0, 7); o.fill();
  o.fillStyle = '#0f0'; o.beginPath(); o.ellipse(W * .5, W * .45, W * .17, W * .22, 0, 0, 7); o.fill();
  const px = o.getImageData(0, 0, W, W).data;
  let s = d.id * 9301 + 49297; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  x.clearRect(0, 0, W, W);
  for (let i = 0; i < 2600; i++) {
    const X = rnd() * W, Y = rnd() * W, p = ((Y | 0) * W + (X | 0)) * 4;
    if (!px[p + 3]) continue;
    const face = px[p + 1] > 200, shirt = px[p + 2] > 200;
    if (face && rnd() > .2) continue;
    x.globalAlpha = shirt ? .9 : .75; x.fillStyle = shirt ? (L.top || C.ink) : C.ink;
    x.fillRect(X, Y, 2.4, 2.4);
  }
  x.globalAlpha = 1;
}

/* ---------- 종이 결 ---------- */
(() => { const n = document.createElement('canvas'); n.width = n.height = 160; const c = n.getContext('2d'), im = c.createImageData(160, 160);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  c.putImageData(im, 0, 0); document.documentElement.style.setProperty('--grain', `url(${n.toDataURL()})`); })();

/* ---------- 시작 ---------- */
renderStatic();
const m = /^#p(\d+)$/.exec(location.hash);
if (m) { const d = STARS.find(x => x.id === +m[1]); if (d) openPerson(d, listFor(d)); }
})();
</script>

     방문 수집 비콘 — 새 웹앱을 만들면 </body> 바로 위에 이걸 붙인다.
     고칠 곳은 SITE 한 줄뿐이다. GAS 는 건드릴 필요 없다.

<script>
(function(){
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycby6J7xGChz7atOL6sVnbiWui8Z1lXVjeF8WUGTj3MXNgEn7EioTz8xZXb522vkAxkgeXA/exec';
  var SITE = 'footnotes';
  try {
    if (location.search.indexOf('owner=1') !== -1) {
      localStorage.setItem('__is_owner__', '1');            /* 내 방문은 이후 영구 제외 */
    } else if (localStorage.getItem('__is_owner__') !== '1'
               && location.protocol !== 'file:'             /* 로컬 헤드리스 테스트 차단 */
               && location.hostname !== 'localhost'
               && location.hostname !== '127.0.0.1') {
      /* 해시 라우팅(#/p/<id>) — 사람별 링크도 기록하되 한 세션에 같은 라우트는 한 번만(portfolio 와 같은 형태) */
      var seen = {};
      var hit = function () {
        var key = location.pathname + location.hash;
        if (seen[key]) return;
        seen[key] = 1;
        var img = new Image();
        img.src = WEBAPP_URL
          + '?t=pv&s=' + encodeURIComponent(SITE)
          + '&p=' + encodeURIComponent(location.pathname + location.hash)
          + '&r=' + encodeURIComponent(document.referrer || 'direct')
          + '&v=' + encodeURIComponent(vid());
      };
      hit();
      window.addEventListener('hashchange', hit);
    }
  } catch (e) {}

  /* 익명 방문자 ID. 사람 단위로 세기 위한 것으로, IP·개인정보는 수집하지 않는다.
     이게 없으면 '몇 명'이 아니라 '페이지뷰 몇 건'밖에 셀 수 없다. */
  function vid(){
    try {
      var k = '__vid__', v = localStorage.getItem(k);
      if (!v) { v = Math.random().toString(36).slice(2) + Date.now().toString(36);
                localStorage.setItem(k, v); }
      return v;
    } catch (e) { return ''; }
  }
})();
</script>
